<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Akun Anda - Portal Modern</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <!-- Kolom Kiri -->
        <aside class="auth-banner" aria-label="Visual Branding">
            <div class="banner-content">
                <div class="brand-badge">
                    <span>Proyek Kreatif</span>
                </div>
                <h1 class="banner-title">Jelajahi Karya Terbaik Komunitas Global.</h1>
                <p class="banner-subtitle">Bergabunglah bersama Kami untuk menciptakan inspirasi tanpa batas.</p>
            </div>
            <div class="banner-footer">
                <p>© 2026 Studio Kreatif. Hak Cipta Dilindungi.</p>
            </div>
        </aside>

        <!-- Kolom Kanan: Formulir Login -->
        <section class="auth-form-section" aria-label="Formulir Otentikasi Pengguna">
            <div class="form-wrapper">
                <!-- Header -->
                <header class="form-header">
                    <a href="#" class="logo-link" aria-label="Halaman Utama Studio Kreatif">
                        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="32" height="32" aria-hidden="true">
                            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l9.96-9.96c.39-.39.39-1.02 0-1.41z"/>
                        </svg>
                        <span class="logo-text">Studitif</span>
                    </a>
                    <h2 class="welcome-title">Selamat Datang Kembali</h2>
                </header>

                <!-- Formulir Utama -->
                <form action="#" method="POST" class="login-form">
                    <div class="form-group">
                        <label for="username">Email atau Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="nama@domain.com" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="text-link forgot-link">Lupa Password?</a>
                        </div>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="remember" name="remember" class="form-checkbox">
                        <label for="remember" class="checkbox-label">Remember password</label>
                    </div>

                    <!-- Tombol Eksekusi Utama -->
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="divider" role="separator" aria-label="atau masuk dengan google">
                    <span>atau</span>
                </div>

                <!-- Tombol SSO Google -->
                <button type="button" class="btn-sso" aria-label="Masuk dengan Google">
                    <svg class="sso-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <!-- Pendaftaran Akun -->
                <footer class="form-footer">
                    <p class="signup-prompt">Belum punya akun? <a href="#" class="text-link">Daftar sekarang</a></p>
                </footer>
            </div>
        </section>
    </main>
</body>
</html>
